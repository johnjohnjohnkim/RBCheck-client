<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RBCheck | Transactions</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Text:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <script src="js/data.js"></script>
  <script src="js/api.js"></script>
</head>
<body>

  <aside class="sidebar">
    <div class="logo">
      <span class="logo-icon">$</span>
      <span class="logo-text">RBCheck</span>
    </div>
    <nav>
      <a href="index.html" class="nav-item">
        <svg viewBox="0 0 24 24"><path d="M3 13h8V3H3v10zm0 8h8v-6H3v6zm10 0h8V11h-8v10zm0-18v6h8V3h-8z"/></svg>
        Dashboard
      </a>
      <a href="transactions.html" class="nav-item active">
        <svg viewBox="0 0 24 24"><path d="M20 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 14H4V8h16v10z"/></svg>
        Transactions
      </a>
      <a href="#" class="nav-item">
        <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/></svg>
        Merchants
      </a>
    </nav>
  </aside>

  <main class="main-content">

    <header class="top-bar">
      <h1 class="page-title">Transactions</h1>
      <div class="header-actions">
        <div class="search-wrap">
          <svg class="search-icon" viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
          <input id="merchant-search" type="text" placeholder="Search merchant..." />
        </div>
        <button class="btn-secondary" id="clear-filters">Clear Filters</button>
        <button class="btn-primary" id="add-tx-btn">+ Add Transaction</button>
      </div>
    </header>

    <section class="filters-bar">
      <div class="filter-group">
        <label for="date-from">From</label>
        <input type="date" id="date-from" />
      </div>
      <div class="filter-group">
        <label for="date-to">To</label>
        <input type="date" id="date-to" />
      </div>
      <div class="filter-group">
        <label for="category-filter">Category</label>
        <select id="category-filter">
          <option value="">All</option>
          <option>Groceries</option>
          <option>Dining</option>
          <option>Shopping</option>
          <option>Gas</option>
          <option>Streaming</option>
          <option>Other</option>
        </select>
      </div>
      <button class="btn-secondary" id="apply-filters">Apply</button>
    </section>

    <section class="table-section">
      <div class="table-header">
        <h2>All Transactions</h2>
        <div class="table-controls">
          <span class="table-count" id="table-count">0 results</span>
          <div class="page-size-wrap">
            <label for="page-size">Show</label>
            <select id="page-size">
              <option value="50">50</option>
              <option value="100">100</option>
              <option value="150">150</option>
            </select>
          </div>
          <span class="page-info" id="page-info">Page 1 of 1</span>
          <div class="pagination-btns">
            <button class="pagination-btn" id="prev-page">&#8249;</button>
            <button class="pagination-btn" id="next-page">&#8250;</button>
          </div>
        </div>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Date</th>
              <th>Merchant</th>
              <th>Category</th>
              <th class="col-amount">Amount</th>
            </tr>
          </thead>
          <tbody id="tx-body"></tbody>
        </table>
      </div>
    </section>

  </main>

  <div class="modal-overlay" id="modal-overlay">
    <div class="modal">
      <div class="modal-header">
        <h2>Add Transaction</h2>
        <button class="modal-close" id="modal-close">&times;</button>
      </div>
      <form id="add-tx-form">
        <div class="form-group">
          <label for="tx-date">Date</label>
          <input type="date" id="tx-date" required />
        </div>
        <div class="form-group">
          <label for="tx-merchant">Merchant</label>
          <input type="text" id="tx-merchant" placeholder="e.g. Whole Foods" required />
        </div>
        <div class="form-group">
          <label for="tx-category">Category</label>
          <select id="tx-category">
            <option>Groceries</option>
            <option>Dining</option>
            <option>Shopping</option>
            <option>Gas</option>
            <option>Streaming</option>
            <option>Other</option>
          </select>
        </div>
        <div class="form-group">
          <label for="tx-amount">Amount ($)</label>
          <input type="number" id="tx-amount" step="0.01" min="0.01" placeholder="0.00" required />
        </div>
        <div class="form-actions">
          <button type="button" class="btn-secondary" id="modal-cancel">Cancel</button>
          <button type="submit" class="btn-primary">Add Transaction</button>
        </div>
      </form>
    </div>
  </div>

  <script src="js/transactions.js"></script>
</body>
</html>
