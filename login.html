<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RBCheck | Sign in</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Text:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: rgb(242, 235, 226);
      --surface: rgb(255, 252, 248);
      --border: rgb(214, 206, 195);
      --text: #1c1712;
      --text-muted: #7a6e64;
      --red: #c0392b;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #17140f;
        --surface: #211d17;
        --border: #3a332a;
        --text: #efe7dc;
        --text-muted: #a99d90;
        --red: #e06b5c;
      }
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 16px;
      background: var(--bg);
      color: var(--text);
      font-family: 'Libre Caslon Text', Georgia, serif;
      font-size: 15px;
    }

    form {
      width: 100%;
      max-width: 340px;
      padding: 32px 28px;
      background: var(--surface);
      border: 1px solid var(--border);
      display: grid;
      gap: 14px;
    }

    h1 { font-size: 28px; text-align: center; }
    .sub { text-align: center; color: var(--text-muted); font-style: italic; margin-bottom: 6px; }

    label { display: grid; gap: 6px; font-size: 13px; color: var(--text-muted); }
    input {
      font: inherit;
      color: var(--text);
      background: transparent;
      border: 1px solid var(--border);
      padding: 9px 10px;
    }

    button {
      font: inherit;
      font-weight: 700;
      padding: 10px;
      border: 1px solid var(--text);
      background: var(--text);
      color: var(--surface);
      cursor: pointer;
    }
    button:disabled { opacity: 0.6; cursor: default; }

    .error { color: var(--red); font-size: 13px; min-height: 1em; }
  </style>
  <script src="js/auth.js"></script>
</head>
<body>
  <form id="login-form">
    <h1>RBCheck</h1>
    <p class="sub">Sign in to your ledger</p>
    <label>Email <input id="email" type="email" autocomplete="username" required autofocus></label>
    <label>Password <input id="password" type="password" autocomplete="current-password" required></label>
    <p class="error" id="error" role="alert"></p>
    <button type="submit" id="submit">Sign in</button>
  </form>

  <script>
    document.getElementById('login-form').addEventListener('submit', async e => {
      e.preventDefault();
      const button = document.getElementById('submit');
      const error = document.getElementById('error');
      button.disabled = true;
      error.textContent = '';
      try {
        await Auth.login(document.getElementById('email').value, document.getElementById('password').value);
        location.replace(Auth.nextPage());
      } catch (err) {
        error.textContent = err.message === 'Failed to fetch' ? 'Can’t reach the server.' : err.message;
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
